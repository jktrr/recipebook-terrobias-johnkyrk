{% extends "base.html" %}

{% block display %}
    <h2>Recipe List</h2>
{% endblock %}

{% block content %}
<ul>
    {% for recipe in object_list %}
    <li><a href="/recipe/{{ recipe.pk }}">{{ recipe.name }}</a></li>
    {% endfor %}
</ul>

    <a href="{% url 'ledger:recipe_add' %}"><br>Add Recipe</a>
{% endblock %}
